<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#065f46" />
    <title>Finora — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #ecfdf5;
        color: #064e3b;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #022c22;
          color: #d1fae5;
        }
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1rem;
        opacity: 0.85;
        line-height: 1.45;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.7rem 1.1rem;
        background: #059669;
        color: #ecfdf5;
        font-weight: 600;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Finora offline</h1>
      <p>Koneksi terputus. Coba lagi saat jaringan kembali — data keuangan tidak di-cache offline.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
